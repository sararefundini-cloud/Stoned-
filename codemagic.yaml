workflows:
  stoned-ios-preview:
    name: STONED - unsigned iPhone simulator build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Compile unsigned iPhone simulator app
        script: |
          xcodebuild -project ios/Stoned.xcodeproj -scheme Stoned \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/Build/Products/Release-iphonesimulator/Stoned.app

  stoned-ios-testflight:
    name: STONED - signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: '27.1'
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sararefundini.stoned
    scripts:
      - name: Set unique build number
        script: |
          sed -i '' "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER:?}/" \
            ios/Stoned/Stoned.xcconfig
      - name: Configure distribution signing
        script: xcode-project use-profiles
      - name: Archive and export signed app
        script: xcode-project build-ipa --project ios/Stoned.xcodeproj --scheme Stoned
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  stoned-ios-screenshots:
    name: STONED - App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: '27.1'
    scripts:
      - name: Prepare screenshot-only app
        script: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/Stoned/App.swift")
          source = path.read_text()
          marker = "        configureMenu()\n"
          assert source.count(marker) == 1
          screenshot_only = r'''
                  if ProcessInfo.processInfo.arguments.contains("--store-gameplay") {
                      game.configuration.userContentController.addUserScript(WKUserScript(
                          source: """
                          (() => {
                            const timer = setInterval(() => {
                              const go = document.getElementById('go');
                              if (go && /(?:TAP|CLICK) TO ENTER/.test(go.textContent)) {
                                clearInterval(timer);
                                go.click();
                              }
                            }, 250);
                            setTimeout(() => clearInterval(timer), 20000);
                          })();
                          """,
                          injectionTime: .atDocumentEnd,
                          forMainFrameOnly: true
                      ))
                      DispatchQueue.main.async { [weak self] in self?.startGame() }
                  }
          '''
          path.write_text(source.replace(marker, marker + screenshot_only))
          PY
      - name: Compile simulator app
        script: |
          xcodebuild -project ios/Stoned.xcodeproj -scheme Stoned \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPhone title and opening gameplay
        script: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/stoned-simulators.json
          UDID=$(python3 - <<'PY'
          import json

          with open("/tmp/stoned-simulators.json") as inventory:
              devices = json.load(inventory)["devices"]
          for runtime, entries in reversed(sorted(devices.items())):
              if ".iOS-" not in runtime:
                  continue
              for device in entries:
                  if device["name"] == "iPhone 17 Pro" and device["isAvailable"]:
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone 17 Pro simulator")
          PY
          )
          echo "Booting iPhone 17 Pro ($UDID)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Stoned.app
          mkdir -p screenshots
          capture() {
            local name="$1"
            xcrun simctl io "$UDID" screenshot "/tmp/$name.png"
            sips -s format jpeg "/tmp/$name.png" --out "screenshots/$name.jpg"
          }
          xcrun simctl launch "$UDID" com.sararefundini.stoned
          sleep 5
          capture stoning-iphone-title
          xcrun simctl terminate "$UDID" com.sararefundini.stoned
          xcrun simctl launch "$UDID" com.sararefundini.stoned --store-gameplay
          xcrun simctl io "$UDID" recordVideo --codec=h264 screenshots/stoned-gameplay.mp4 &
          RECORD_PID=$!
          trap 'kill -INT "$RECORD_PID" 2>/dev/null || true' EXIT
          sleep 30
          kill -INT "$RECORD_PID" 2>/dev/null || true
          wait "$RECORD_PID" || true
          trap - EXIT
          capture stoning-iphone-gameplay
    artifacts:
      - screenshots/*.jpg
      - screenshots/*.mp4

  stoned-ios-upload-screenshots:
    name: STONED - upload App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: '27.1'
    scripts:
      - name: Upload The Stoning listing screenshots
        script: |
          set -euo pipefail
          export STONED_SCREENSHOTS_DIR="$(mktemp -d)"
          trap 'rm -rf "$STONED_SCREENSHOTS_DIR"' EXIT
          mkdir -p "$STONED_SCREENSHOTS_DIR/en-US"
          cp stoned-store-upload/01-hallway.png "$STONED_SCREENSHOTS_DIR/en-US/"
          cp stoned-store-upload/02-title.jpg "$STONED_SCREENSHOTS_DIR/en-US/"
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          lane :stoned_store_screenshots do
            api_key = app_store_connect_api_key(
              key_id: ENV.fetch("APP_STORE_CONNECT_KEY_IDENTIFIER"),
              issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
              key_content: (key = ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY").strip.gsub('\n', "\n"); key.start_with?("-----BEGIN") ? key : Base64.strict_decode64(key.gsub(/\s+/, ""))),
              duration: 1200
            )
            upload_to_app_store(
              api_key: api_key,
              app_identifier: "com.sararefundini.stoned",
              app_version: "1.0",
              screenshots_path: ENV.fetch("STONED_SCREENSHOTS_DIR"),
              skip_app_version_update: true,
              skip_binary_upload: true,
              skip_metadata: true,
              overwrite_screenshots: false,
              submit_for_review: false,
              run_precheck_before_submit: false,
              force: true,
              screenshot_processing_timeout: 360
            )
          end
          RUBY
          fastlane stoned_store_screenshots
